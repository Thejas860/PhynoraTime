<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b2be0" />
  <title>PhynoraTime</title>

  <!-- Logo & PWA -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="PhynoraTime Logo" class="logo">
    <h1>PhynoraTime</h1>
    <p>Your Countdown Defines Your Destiny ⏳</p>
  </header>

  <main>
    <section class="countdown">
      <h2>⏰ Countdown</h2>
      <label>Start (date)</label>
      <input type="date" id="startInput" />
      <label>End (date)</label>
      <input type="date" id="endInput" />
      <label>Mission (name)</label>
      <input type="text" id="missionInput" placeholder="Enter your mission name e.g., Phoenix" />
      <button id="setBtn">Set Target & Start</button>

      <p>Or build target by adding time to Start</p>
      <div class="duration">
        <input id="durYears" type="number" placeholder="Years">
        <input id="durMonths" type="number" placeholder="Months">
        <input id="durWeeks" type="number" placeholder="Weeks">
        <input id="durDays" type="number" placeholder="Days">
        <input id="durHours" type="number" placeholder="Hours">
        <input id="durMins" type="number" placeholder="Minutes">
        <input id="durSecs" type="number" placeholder="Seconds">
        <input id="durMillis" type="number" placeholder="Millis">
      </div>

      <p id="summaryLine"></p>
      <div id="progressBar"><div id="fill"></div></div>
      <p id="progressText">0.00% complete</p>

      <div class="time-grid">
        <div><h3>YEARS</h3><p data-unit="years">0</p></div>
        <div><h3>MONTHS</h3><p data-unit="months">0</p></div>
        <div><h3>WEEKS</h3><p data-unit="weeks">0</p></div>
        <div><h3>DAYS</h3><p data-unit="days">0</p></div>
        <div><h3>HOURS</h3><p data-unit="hours">0</p></div>
        <div><h3>MINUTES</h3><p data-unit="minutes">0</p></div>
        <div><h3>SECONDS</h3><p data-unit="seconds">0</p></div>
        <div><h3>MILLISECONDS</h3><p data-unit="millis">000</p></div>
      </div>
    </section>

    <section id="goals">
      <h2>🎯 Goals Tracker</h2>
      <input id="newGoal" type="text" placeholder="Add your goal..." />
      <button id="add">Add Goal</button>
      <p id="stats">0 / 0 completed</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
